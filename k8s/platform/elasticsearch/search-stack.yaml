apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: ${SEARCH_CLUSTER_NAME}
  namespace: ${SEARCH_NAMESPACE}
spec:
  version: ${ELASTICSEARCH_VERSION}
  auth: {}
  http:
    tls:
      certificate: {}
  transport:
    tls:
      certificate: {}
      certificateAuthorities: {}
  monitoring:
    logs: {}
    metrics: {}
  updateStrategy:
    changeBudget: {}
  nodeSets:
    - name: master
      count: ${ES_MASTER_COUNT}
      config:
        node.roles: ["master"]
      podTemplate:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    labelSelector:
                      matchLabels:
                        elasticsearch.k8s.elastic.co/cluster-name: search-stack
                        elasticsearch.k8s.elastic.co/statefulset-name: search-stack-es-master
          nodeSelector:
            elasticsearch.role: master
          tolerations:
            - key: elasticsearch.role
              operator: Equal
              value: master
              effect: NoSchedule
          initContainers:
            - name: sysctl
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
              securityContext:
                privileged: true
                runAsUser: 0
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: ${ES_MASTER_JAVA_OPTS}
              resources:
                requests:
                  cpu: ${ES_MASTER_CPU_REQUEST}
                  memory: ${ES_MASTER_MEMORY_REQUEST}
                limits:
                  cpu: ${ES_MASTER_CPU_LIMIT}
                  memory: ${ES_MASTER_MEMORY_LIMIT}
    - name: hot
      count: ${ES_HOT_COUNT}
      config:
        indices.memory.index_buffer_size: 20%
        node.attr.data: hot
        node.roles: ["data_hot", "data_content", "ingest", "transform"]
        thread_pool.write.queue_size: 2000
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: ${ES_HOT_STORAGE_CLASS}
            resources:
              requests:
                storage: ${ES_HOT_STORAGE}
      podTemplate:
        spec:
          nodeSelector:
            elasticsearch.role: data-hot
          tolerations:
            - key: elasticsearch.role
              operator: Equal
              value: data-hot
              effect: NoSchedule
            - key: elasticsearch.role
              operator: Equal
              value: hot
              effect: NoSchedule
          initContainers:
            - name: sysctl
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
              securityContext:
                privileged: true
                runAsUser: 0
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: ${ES_HOT_JAVA_OPTS}
              resources:
                requests:
                  cpu: ${ES_HOT_CPU_REQUEST}
                  memory: ${ES_HOT_MEMORY_REQUEST}
                limits:
                  cpu: ${ES_HOT_CPU_LIMIT}
                  memory: ${ES_HOT_MEMORY_LIMIT}
    - name: warm
      count: ${ES_WARM_COUNT}
      config:
        node.attr.data: warm
        node.roles: ["data_warm"]
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: ${ES_WARM_STORAGE_CLASS}
            resources:
              requests:
                storage: ${ES_WARM_STORAGE}
      podTemplate:
        spec:
          nodeSelector:
            elasticsearch.role: data-warm
          tolerations:
            - key: elasticsearch.role
              operator: Equal
              value: data-warm
              effect: NoSchedule
            - key: elasticsearch.role
              operator: Equal
              value: warm
              effect: NoSchedule
          initContainers:
            - name: sysctl
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
              securityContext:
                privileged: true
                runAsUser: 0
          containers:
            - name: elasticsearch
              env:
                - name: ES_JAVA_OPTS
                  value: ${ES_WARM_JAVA_OPTS}
              resources:
                requests:
                  cpu: ${ES_WARM_CPU_REQUEST}
                  memory: ${ES_WARM_MEMORY_REQUEST}
                limits:
                  cpu: ${ES_WARM_CPU_LIMIT}
                  memory: ${ES_WARM_MEMORY_LIMIT}
