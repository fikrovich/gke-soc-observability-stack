apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-ops-api
  namespace: investigations
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: investigation-ops
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investigation-ops
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: investigation-ops-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ${INVESTIGATION_OPS_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.api.main"]
          envFrom:
            - configMapRef:
                name: investigation-ops-config
            - secretRef:
                name: investigation-ops-secret
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
