apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-ops-worker
  namespace: investigations
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: investigation-ops
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investigation-ops
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: investigation-ops-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: elastic-http-ca
          secret:
            secretName: investigation-search-ca
            items:
              - key: tls.crt
                path: tls.crt
      containers:
        - name: worker
          image: ${INVESTIGATION_OPS_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker.main"]
          envFrom:
            - configMapRef:
                name: investigation-ops-config
            - secretRef:
                name: investigation-ops-secret
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: elastic-http-ca
              mountPath: /var/run/secrets/elastic
              readOnly: true
