apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: monitoring
  labels:
    app: elasticsearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
      annotations:
        prometheus.io/port: "9114"
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
          args:
            - --es.uri=$(ES_URI)
            - --es.all
            - --es.indices
            - --es.indices_settings
            - --es.indices_mappings
            - --es.shards
            - --es.ilm
            - --es.timeout=30s
            - --es.ssl-skip-verify
            - --web.listen-address=:9114
            - --web.telemetry-path=/metrics
            - --collector.clustersettings
            - --collector.snapshots
          env:
            - name: ES_URI
              valueFrom:
                secretKeyRef:
                  name: es-exporter-creds
                  key: ES_URI
          ports:
            - name: http-metrics
              containerPort: 9114
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9114
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9114
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter
  namespace: monitoring
  labels:
    app: elasticsearch-exporter
spec:
  selector:
    app: elasticsearch-exporter
  ports:
    - name: http-metrics
      port: 9114
      targetPort: 9114
