apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
    - job_name: 'elasticsearch-exporter'
      static_configs:
      - targets: ['elasticsearch-exporter.monitoring.svc.cluster.local:9114']
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 25s
