steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/edge-ingest:$SHORT_SHA', '.']
  
# Push the immutable build tag to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/edge-ingest:$SHORT_SHA'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
