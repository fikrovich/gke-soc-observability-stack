id: source_entity_concentration
description: Investigate a source entity associated with an unusually high number of related identifiers.
analysis_mode: generic
match:
  alert_name_contains:
    - source concentration anomaly
    - source entity concentration
    - identity concentration
  service_in: []
  label_equals: {}
  annotation_contains:
    summary:
      - concentration anomaly
window:
  lookback_minutes: 60
  lookahead_minutes: 5
baseline:
  window_minutes: 60
  offset_windows: 6
indices:
  - edge-logs
filters:
  - canonical_field: client_ip
    operator: entity_hint
    required: true
field_mappings:
  timestamp: "@timestamp"
  client_ip: "ClientIP.keyword"
  asn: "ClientASN"
  path: "ClientRequestPath.keyword"
  uri: "ClientRequestURI.keyword"
  user_agent: "ClientRequestUserAgent.keyword"
  edge_status: "EdgeResponseStatus"
  origin_status: "OriginResponseStatus"
  security_action: "SecurityAction.keyword"
  security_actions: "SecurityActions.keyword"
  security_rule_description: "SecurityRuleDescription.keyword"
  device_id: "RequestHeaders.device-uid.keyword"
  account_id: "RequestHeaders.account-id.keyword"
  client_hint: "RequestHeaders.client-id.keyword"
  session_id: "RequestHeaders.session-id.keyword"
  access_user: "RequestHeaders.ed-access-user.keyword"
feature_flags:
  device_concentration: true
  client_hint_concentration: true
  session_concentration: false
  unique_accounts_per_ip: true
  unique_devices_per_account: false
  unique_devices_per_ip: true
  unique_ips_per_device: false
  unique_ips_per_session: false
  new_account_ratio: false
  challenge_outcome_distribution: false
recommended_mitigations:
  - Scope mitigation to the source entity while validating whether the concentration is expected.
  - Check whether the source maps to shared infrastructure before broad blocking.
recommended_query_templates:
  - '{client_ip_field}:"{top_ip}" and {device_id_field}:*'
  - '{client_ip_field}:"{top_ip}" and {account_id_field}:*'
