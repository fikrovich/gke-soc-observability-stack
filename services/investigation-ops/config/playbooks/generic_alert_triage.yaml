id: generic_alert_triage
description: Generic fallback triage when no specialized playbook matches the alert.
default: true
analysis_mode: generic
match:
  alert_name_contains: []
  service_in: []
  label_equals: {}
  annotation_contains: {}
window:
  lookback_minutes: 15
  lookahead_minutes: 15
baseline:
  window_minutes: 15
  offset_windows: 6
indices:
  - edge-logs
filters: []
field_mappings:
  timestamp: "@timestamp"
  client_ip: "ClientIP.keyword"
  asn: "ClientASN"
  path: "ClientRequestPath.keyword"
  uri: "ClientRequestURI.keyword"
  user_agent: "ClientRequestUserAgent.keyword"
  edge_status: "EdgeResponseStatus"
  origin_status: "OriginResponseStatus"
  security_action: "SecurityAction.keyword"
  security_actions: "SecurityActions.keyword"
  security_rule_description: "SecurityRuleDescription.keyword"
  device_id: "RequestHeaders.device-uid.keyword"
  account_id: "RequestHeaders.account-id.keyword"
  client_hint: "RequestHeaders.client-id.keyword"
  session_id: "RequestHeaders.session-id.keyword"
  access_user: "RequestHeaders.ed-access-user.keyword"
feature_flags:
  device_concentration: true
  client_hint_concentration: true
  session_concentration: true
  unique_accounts_per_ip: true
  unique_devices_per_account: true
  unique_devices_per_ip: true
  unique_ips_per_device: true
  unique_ips_per_session: true
  new_account_ratio: false
  challenge_outcome_distribution: false
hypothesis_thresholds:
  concentration_ratio_high: 0.75
  request_spike_ratio_high: 3.0
  request_spike_delta_high: 500.0
  suspicious_action_ratio: 0.3
recommended_mitigations:
  - Review the alert annotations and raw Grafana investigate links before taking automated action.
  - Use the generated result document to decide whether a dedicated playbook is needed for this alert family.
recommended_query_templates:
  - '{path_field}:*'
  - '{edge_status_field}:*'
  - '{security_action_field}:*'
